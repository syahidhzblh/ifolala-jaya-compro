<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">

    .error-code {
      font-family: var(--font-display);

      color: var(--accent);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      text-shadow: 0 4px 30px rgba(245, 158, 11, 0.25);
    }
    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
      color: var(--ink);
    }
    .error-desc {
      color: var(--ink-secondary);
      max-width: 520px;
      margin: 0 auto 36px;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

</head>
<body>

  <header class="site-header">

      <div class="error-actions">

        <a href="https://wa.me/6281382443328?text=Halo%20Ifolala%20Jaya%2C%20saya%20terkendala%20saat%20mengakses%20halaman%20website%20dan%20ingin%20konsultasi%20langsung." class="btn btn-wa" target="_blank" rel="noopener noreferrer">

  </main>

  <footer class="site-footer" style="padding-top: 40px;">
    <div class="container">
      <div class="footer-bottom-row" style="border-top: 1px solid var(--surface-dark-active); padding-top: 24px;">
        <div>Hak Cipta 2001 – 2026 Ifolala Jaya. Bengkel Las & Konstruksi Tangerang.</div>
        <div><a href="/" style="color: var(--accent);">Beranda</a></div>
      </div>
    </div>
